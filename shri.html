<!DOCTYPE html>
<html>
<head>
    <title>Centered Text Animation</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111827;
        }

        #animatedText {
            text-align: center;
            margin: 0;
        }
    </style>
</head>

<body>
    <h1 id="animatedText"></h1>

    <script>
        var textElement = document.getElementById("animatedText");
        var fontSize = 5;
        var isGrowing = true;

        textElement.innerText = "TEXT-GROWING";
        textElement.style.color = "skyblue";

        setInterval(changeSize, 50);

        function changeSize() {
            if (isGrowing) {
                fontSize++;

                if (fontSize >= 50) {
                    isGrowing = false;
                    textElement.innerText = "TEXT-SHRINKING";
                    textElement.style.color = "blue";
                }
            } else {
                fontSize--;

                if (fontSize <= 5) {
                    isGrowing = true;
                    textElement.innerText = "TEXT-GROWING";
                    textElement.style.color = "skyblue";
                }
            }

            textElement.style.fontSize = fontSize + "pt";
        }
    </script>
</body>
</html>
